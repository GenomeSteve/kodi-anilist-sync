name: Verify WatchNixtoons2 0.14.24 source compatibility
on:
  pull_request:
    paths:
      - 'tools/inspect_wnt2_01424.py'
      - '.github/workflows/verify-wnt2-01424.yml'
      - 'integration/watchnixtoons2-kodi19/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned original zip and examine episode list hooks
        run: python tools/inspect_wnt2_01424.py
