name: Cross-device sync regression tests
on:
  push:
    branches: [feature/cross-device-watched-v0.4.0]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all historical and live-sync regressions
        run: python -m unittest discover -s tests -v
      - name: Compile and validate Kodi metadata
        run: |
          python -m compileall -q src/script.watchnixtoons.anilist tests
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          a=ET.parse('src/script.watchnixtoons.anilist/addon.xml').getroot()
          assert tuple(map(int, a.attrib['version'].split('.'))) >= (0,4,0)
          assert a.attrib['id']=='script.watchnixtoons.anilist'
          PY
      - name: Verify original tracking logic is preserved
        run: |
          for file in watched_db.py core.py anilist_api.py storage.py history_import.py historical_ui.py; do
            git diff --exit-code origin/main -- "src/script.watchnixtoons.anilist/$file"
          done
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = 'src/script.watchnixtoons.anilist/'
          def original(path):
              return subprocess.check_output(['git','show','origin/main:'+path], text=True)
          def routines(source):
              return {node.name: ast.dump(node) for node in ast.parse(source).body
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))
                      and node.name != 'run'}
          # The original tracker must remain AST-identical after removing only
          # three precisely defined notification-only additions to reconcile().
          class StripConfirmedUploadToast(ast.NodeTransformer):
              def __init__(self):
                  self.assignments = []
                  self.toasts = 0
              def visit_Assign(self, node):
                  if len(node.targets) == 1 and isinstance(node.targets[0], ast.Name) and node.targets[0].id == 'sent_to_anilist':
                      assert isinstance(node.value, ast.Constant) and isinstance(node.value.value, bool)
                      self.assignments.append(node.value.value)
                      return None
                  return self.generic_visit(node)
              def visit_If(self, node):
                  if isinstance(node.test, ast.Name) and node.test.id == 'sent_to_anilist':
                      expected = ast.parse('''
          if sent_to_anilist:
              label = '%s Season %s Episode %s' % (
                  event.get('title') or mapping.get('title') or 'Anime',
                  event.get('season', 1), event['episode'])
              notify_sync(ADDON, 'AniList', [('progress', label)])
          ''').body[0]
                      assert ast.dump(node) == ast.dump(expected)
                      self.toasts += 1
                      return None
                  return self.generic_visit(node)
          candidate_tree = ast.parse(Path(root+'service.py').read_text())
          stripped = StripConfirmedUploadToast()
          candidate_tree = stripped.visit(candidate_tree)
          assert stripped.assignments == [False, True]
          assert stripped.toasts == 1
          assert routines(original(root+'service.py')) == routines(ast.unparse(candidate_tree))
          def settings(xml):
              root = ET.fromstring(xml)
              return {setting.get('id'): ET.tostring(setting).strip()
                      for setting in root.iter('setting')}
          baseline = settings(original(root+'resources/settings.xml'))
          candidate = settings(Path(root+'resources/settings.xml').read_text())
          assert all(candidate.get(k)==v for k,v in baseline.items())
          PY
