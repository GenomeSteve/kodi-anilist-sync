name: Publish paired v0.5.3 beta installers to GitHub Pages
on:
  push:
    paths:
      - 'beta/v053/publish-request.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify source build and download exact two installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=41286022944
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "492974702639e1b403f0fe811bf4bc8382317b08"
          mkdir -p "$RUNNER_TEMP/wnt2-beta"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name wnt2-startup-sync-v053-beta-installers --dir "$RUNNER_TEMP/wnt2-beta"
          cd "$RUNNER_TEMP/wnt2-beta"
          echo "baf458aa9e07257c6b331e0a28b68d7b385951660f32191707d9c223f40ff3a6  plugin.video.watchnixtoons2-0.14.24.1-sync-beta.zip" | sha256sum --check
          echo "c03e86eca534f210f11cfab76564e965dd6a54120f5dee3fc01533873607dfdb  script.watchnixtoons.anilist-0.5.3-beta.zip" | sha256sum --check
      - name: Publish separate opt-in beta folder, never update stable feed
        run: |
          set -euo pipefail
          mkdir -p beta/v053
          cp "$RUNNER_TEMP/wnt2-beta/plugin.video.watchnixtoons2-0.14.24.1-sync-beta.zip" beta/v053/
          cp "$RUNNER_TEMP/wnt2-beta/script.watchnixtoons.anilist-0.5.3-beta.zip" beta/v053/
          cat > beta/v053/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Index of /kodi-anilist-sync/beta/v053/</title></head>
          <body>
          <h1>WatchNixtoons2 startup sync - opt-in paired v0.5.3 beta</h1>
          <p>For Kodi 21 with source-verified WatchNixtoons2 v0.14.24 only. Two ZIP installations are required. Existing add-on profiles and watched history should be retained. This beta is not hardware verified.</p>
          <ul>
            <li><a href="script.watchnixtoons.anilist-0.5.3-beta.zip">script.watchnixtoons.anilist-0.5.3-beta.zip</a></li>
            <li><a href="plugin.video.watchnixtoons2-0.14.24.1-sync-beta.zip">plugin.video.watchnixtoons2-0.14.24.1-sync-beta.zip</a></li>
          </ul>
          <p>Confirm installed WatchNixtoons2 ID is plugin.video.watchnixtoons2; do not install on plugin.video.watchnixtoons2.kodi19. Start with one Firestick only. Restart Kodi after installing both add-ons. Do not change existing AniList or private GitHub credentials.</p>
          <p><a href="https://github.com/GenomeSteve/kodi-anilist-sync/pull/7">Source and testing</a></p>
          </body></html>
          HTML
          cat > beta/v053/SHA256.txt <<'HASHES'
          baf458aa9e07257c6b331e0a28b68d7b385951660f32191707d9c223f40ff3a6  plugin.video.watchnixtoons2-0.14.24.1-sync-beta.zip
          c03e86eca534f210f11cfab76564e965dd6a54120f5dee3fc01533873607dfdb  script.watchnixtoons.anilist-0.5.3-beta.zip
          HASHES
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/v053/index.html beta/v053/SHA256.txt beta/v053/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-verified paired v0.5.3 Kodi beta installers"
            git push origin HEAD:main
          fi
